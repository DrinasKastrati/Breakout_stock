name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-pages.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check breakout_lab/static/app.js && node --check breakout_lab/static/data-client.js
      - run: python -m breakout_lab demo
      - run: python -m breakout_lab scan > /tmp/scan.json
      - run: python -m breakout_lab backtest > /tmp/backtest.json
      - run: python -m breakout_lab build-site --source demo --repository "$GITHUB_REPOSITORY"
