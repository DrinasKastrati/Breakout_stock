name: Portfolio backtest

on:
  workflow_dispatch:
    inputs:
      years:
        description: Completed years to test (plus one extra warmup year)
        type: choice
        options: ['2', '1', '3']
        default: '2'
      capital:
        description: Starting simulated capital in USD
        type: string
        default: '100000'
      allocation:
        description: Allocation (all_in buys one stock using all available cash)
        type: choice
        options: [risk_budget, all_in]
        default: risk_budget

permissions:
  contents: read

concurrency:
  group: portfolio-research
  cancel-in-progress: false

jobs:
  backtest:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-pages.txt
      - run: python -m unittest discover -s tests -v
      - name: Run two-year portfolio research
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
          TEST_YEARS: ${{ inputs.years }}
          TEST_CAPITAL: ${{ inputs.capital }}
          TEST_ALLOCATION: ${{ inputs.allocation }}
        run: python -m breakout_lab.portfolio --years "$TEST_YEARS" --capital "$TEST_CAPITAL" --allocation "$TEST_ALLOCATION"
      - name: Upload aggregated report and encrypted personal details
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portfolio-report
          path: dist/portfolio
          retention-days: 1
