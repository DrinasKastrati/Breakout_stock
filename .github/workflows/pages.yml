name: Update dashboard

on:
  push:
    branches: [main]
    paths-ignore: ['.github/heartbeat.txt']
  workflow_dispatch:
    inputs:
      source:
        description: Data source (auto uses Alpaca when keys exist)
        type: choice
        options: [auto, demo, alpaca]
        default: auto
      force:
        description: Re-fetch data corrections or intentionally switch to demo
        type: boolean
        default: false
  schedule:
    # UTC: 20:37/21:37 NY in winter, 21:37/22:37 in summer, Mon-Fri sessions.
    # Second run also checks late data corrections. Identical data skips deployment.
    - cron: '37 1 * * 2-6'
    - cron: '37 2 * * 2-6'

permissions:
  contents: read

concurrency:
  group: pages-main
  cancel-in-progress: false

jobs:
  publish:
    # Explicitly enabled on the website, and public-only to use free Pages/runners.
    if: >-
      github.event.repository.private == false && vars.ENABLE_PAGES == 'true' &&
      (github.event_name != 'schedule' || vars.ENABLE_AUTO_UPDATE == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-pages.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/site
          key: site-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: site-v1-
      - name: Fetch and build personal analysis
        id: build
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
          SITE_SOURCE: ${{ github.event_name == 'schedule' && 'alpaca' || inputs.source || 'auto' }}
          SITE_FORCE: ${{ inputs.force || (github.event_name == 'schedule' && github.event.schedule == '37 2 * * 2-6') }}
        run: |
          site_args=(build-site --source "$SITE_SOURCE" --repository "$GITHUB_REPOSITORY")
          if [ "$SITE_FORCE" = 'true' ]; then site_args+=(--force); fi
          python -m breakout_lab "${site_args[@]}"
      - name: Configure Pages
        if: steps.build.outputs.changed == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload static site
        if: steps.build.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/site
          retention-days: 1
      - name: Deploy
        if: steps.build.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Cache only the successfully deployed snapshot
        if: steps.build.outputs.changed == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: dist/site
          key: site-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Update summary
        env:
          SESSION: ${{ steps.build.outputs.as_of }}
          MODE: ${{ steps.build.outputs.mode }}
          CHANGED: ${{ steps.build.outputs.changed }}
        run: |
          echo "Session: $SESSION | Mode: $MODE | New deployment: $CHANGED" >> "$GITHUB_STEP_SUMMARY"

  keepalive:
    # Public scheduled workflows otherwise stop after 60 days of repository inactivity.
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Record repository activity once per month
        run: |
          python -c 'from datetime import datetime, timezone; from pathlib import Path; Path(".github/heartbeat.txt").write_text(datetime.now(timezone.utc).strftime("%Y-%m") + "\n")'
          git add .github/heartbeat.txt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Maintain dashboard schedule activity'
          git push origin HEAD:main
