name: Strategy experiments (9 variants)
on:
  workflow_dispatch:
    inputs:
      years:
        description: Years of daily data to compare
        type: choice
        options: ['2']
        default: '2'
      capital:
        description: Starting simulated capital in USD
        type: string
        default: '100000'
permissions:
  contents: read
concurrency:
  group: portfolio-research
  cancel-in-progress: false
jobs:
  experiments:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-pages.txt
      - run: python -m unittest discover -s tests -v
      - name: Compare nine strategies on one shared free dataset
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          DASHBOARD_PASSPHRASE: ${{ secrets.DASHBOARD_PASSPHRASE }}
          TEST_YEARS: ${{ inputs.years }}
          TEST_CAPITAL: ${{ inputs.capital }}
        run: python -m breakout_lab.experiments --years "$TEST_YEARS" --capital "$TEST_CAPITAL"
      - name: Upload aggregate comparison and encrypted personal details
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: strategy-experiments-report
          path: dist/experiments
          retention-days: 1
